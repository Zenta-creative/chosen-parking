<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>CHOSEN V | Parking Confirmation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#38220c 0%,#110d08 42%,#050505 85%);color:#fff;font-family:Arial,Helvetica,sans-serif;padding:24px}.frame{max-width:440px;width:100%;min-height:650px;border:1px solid #9d702d;background:linear-gradient(135deg,rgba(218,154,55,.14),transparent 22%,transparent 78%,rgba(218,154,55,.11)),#080808;box-shadow:0 0 45px #b77e2521,inset 0 0 0 5px #050505;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 25px}.eyebrow{color:#c9a060;letter-spacing:.25em;font-size:11px}.brand{font-family:Georgia,serif;font-size:clamp(54px,12vw,77px);letter-spacing:-.065em;font-weight:bold;line-height:1.2;margin:10px 0 0;background:linear-gradient(#fff0b8,#bb7628 50%,#efc875 68%,#754010);color:transparent;background-clip:text}.roman{font:600 38px Georgia,serif;color:#e6d8c0;margin-top:-3px}.line{height:1px;background:linear-gradient(90deg,transparent,#b58440,transparent);width:85%;margin:29px auto}.check{height:80px;width:80px;border:2px solid #b88d4b;border-radius:50%;display:grid;place-items:center;margin:5px auto 19px;color:#e8bf74;font-size:46px}.heading{font-size:22px;letter-spacing:.12em;color:#eac37e;font-weight:700;margin:0 0 12px}.sub{color:#bcb9b4;font-size:14px;line-height:1.6}.number{font:700 79px Georgia,serif;color:#fff;margin:20px 0 10px}.tag{font-size:12px;letter-spacing:.18em;color:#d4a65c;margin-bottom:28px}.foot{font-size:12px;color:#aaa;line-height:1.7}.error .heading{color:#e7a4a4}
</style>
</head>
<body>
<main class="frame" id="card"><div class="eyebrow">SIMSON GYM PRESENTS</div><div class="brand">CHOSEN</div><div class="roman">V</div><div class="line"></div><div class="check" id="check">✓</div><h1 class="heading" id="heading">PARKING CONFIRMED</h1><div class="sub" id="subtitle">Your reserved parking space</div><div class="number" id="number">P01</div><div class="tag" id="tag">AUTHORIZED PARKING PASS</div><div class="foot" id="foot">Present this confirmation to the parking attendant.<br>No online check-in is required.</div></main>
<script>
const p=new URLSearchParams(window.location.search).get('pass');
const code=(p||'').toUpperCase();const valid=/^P(0[1-9]|1[0-9]|2[0-2])$/.test(code);
if(valid){document.getElementById('number').textContent=code;document.title='CHOSEN V | Parking '+code;}
else{document.getElementById('card').classList.add('error');document.getElementById('check').textContent='!';document.getElementById('heading').textContent='PASS NOT FOUND';document.getElementById('subtitle').textContent='Please scan the QR code on your parking pass.';document.getElementById('number').textContent='—';document.getElementById('tag').textContent='CHOSEN V PARKING';document.getElementById('foot').textContent='Contact the event organizer for assistance.';}
</script>
</body>
</html>
